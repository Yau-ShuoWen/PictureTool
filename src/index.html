<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哏圖整理</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brand-mark">▦</span><div><strong>哏圖整理</strong><small id="root-label"></small></div></div><div class="top-actions"><button id="history-btn">整理记录</button><button id="duplicates-btn">查找重复</button><button id="queue-btn" class="primary">待移动 <span id="queue-count">0</span></button></div></header>
<main><section class="images-panel"><div class="panel-head"><div><div class="eyebrow">图片</div><h1 id="folder-title">加载中…</h1><p id="folder-path"></p></div><div class="head-actions"><span id="image-count"></span><button id="select-all">全选</button></div></div><div class="toolbar"><input id="filter" placeholder="筛选当前文件夹的文件名" aria-label="筛选图片"><span id="selected-count">未选择图片</span></div><div id="images" class="image-grid"></div></section>
<section class="portals-panel"><div class="panel-head"><div><div class="eyebrow">快捷方式</div><h2>传送门</h2><p>把右侧文件夹拖到这里</p></div></div><div id="portals" class="portals"></div><div class="panel-note">把选中的图片拖到传送门，先加入待移动清单。</div></section>
<section class="tree-panel"><div class="panel-head"><div><div class="eyebrow">文件夹</div><h2>目录树</h2><p>浏览与选择整理位置</p></div></div><input id="tree-filter" placeholder="查找文件夹" aria-label="查找文件夹"><div id="tree" class="tree"></div></section></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></div><div id="modal-body"></div><div id="modal-actions"></div></dialog><div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
