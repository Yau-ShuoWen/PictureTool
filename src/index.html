<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哏圖整理</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="brand-mark">▦</span><div><strong>哏圖整理</strong><small id="root-label"></small></div></div><div class="top-actions"><button id="history-btn">整理记录</button><button id="duplicates-btn">查找重复</button><button id="queue-btn" class="primary">待移动 <span id="queue-count">0</span></button></div></header>
<main><section class="images-panel"><div class="panel-head"><div><div class="eyebrow">图片</div><h1 id="folder-title">加载中…</h1><p id="folder-path"></p></div><div class="head-actions"><span id="image-count"></span><button id="select-all">全选</button></div></div><div class="toolbar"><input id="filter" placeholder="筛选当前文件夹的文件名" aria-label="筛选图片"><span id="selected-count">未选择图片</span><button id="set-cover" disabled>设为文件夹图标</button></div><div id="browser-content" class="browser-content"><div id="folder-strip" class="folder-strip"></div><div id="images" class="image-grid"></div></div></section>
<section class="portals-panel"><div class="panel-head"><div><div class="eyebrow">快捷方式</div><h2>传送门</h2><p>把右侧文件夹拖到这里</p></div></div><div id="portals" class="portals"></div><div class="panel-note">把选中的图片拖到传送门，先加入待移动清单。</div></section>
<section class="tree-panel"><div class="panel-head"><div><div class="eyebrow">文件夹</div><h2>逐层浏览</h2><p>点击文件夹进入下一层</p></div></div><div id="folder-breadcrumbs" class="folder-breadcrumbs"></div><input id="tree-filter" placeholder="筛选这一层的文件夹" aria-label="筛选文件夹"><div id="tree" class="folder-grid"></div></section></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></div><div id="modal-body"></div><div id="modal-actions"></div></dialog><dialog id="preview-dialog"><div class="preview-top"><span id="preview-name"></span><button id="preview-close" aria-label="关闭预览">×</button></div><div class="preview-stage"><button id="preview-prev" aria-label="上一张"><img src="assets/to-left.svg" alt=""></button><div id="preview-canvas"><img id="preview-image" alt=""></div><button id="preview-next" aria-label="下一张"><img src="assets/to-right.svg" alt=""></button></div></dialog><div id="image-context-menu" class="image-context-menu" hidden><button id="context-reveal">在文件夹中显示</button><button id="context-open">用图片应用打开</button></div><div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
