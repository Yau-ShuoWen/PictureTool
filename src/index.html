<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哏圖整理</title><link rel="stylesheet" href="style.css"></head><body>
<div class="compact-controls"><span id="root-label" hidden></span><button id="history-btn" hidden>整理记录</button><button id="duplicates-btn" hidden>查找重复</button><button id="queue-btn" class="primary">待移动 <span id="queue-count">0</span></button></div>
<main class="two-pane"><section id="left-pane" class="file-pane"></section><section id="right-pane" class="file-pane"></section></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></div><div id="modal-body"></div><div id="modal-actions"></div></dialog><dialog id="preview-dialog"><div class="preview-top"><span id="preview-name"></span><button id="preview-close" aria-label="关闭预览">×</button></div><div class="preview-stage"><button id="preview-prev" aria-label="上一张"><img src="assets/to-left.svg" alt=""></button><div id="preview-canvas"><img id="preview-image" alt=""></div><button id="preview-next" aria-label="下一张"><img src="assets/to-right.svg" alt=""></button></div></dialog><div id="image-context-menu" class="image-context-menu" hidden><button id="context-reveal">在文件夹中显示</button><button id="context-open">用图片应用打开</button><button id="context-cover">设为文件夹图标</button></div><div id="toast" role="status"></div><script src="two-pane.js"></script></body></html>
